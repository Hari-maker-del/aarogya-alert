name: Staging Supabase integration

on:
  workflow_dispatch:
    inputs:
      staging_project_ref:
        description: "The 20-character project ref of the dedicated staging Supabase project (never production)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  supabase-integration:
    name: Supabase Auth and PostgreSQL persistence
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install "httpx>=0.27,<1.0"
      - name: Verify staging Auth and durable workflow records
        working-directory: backend
        env:
          AAROGYA_STAGING_SUPABASE_URL: ${{ secrets.AAROGYA_STAGING_SUPABASE_URL }}
          AAROGYA_STAGING_PUBLISHABLE_KEY: ${{ secrets.AAROGYA_STAGING_PUBLISHABLE_KEY }}
          AAROGYA_STAGING_REVIEWER_EMAIL: ${{ secrets.AAROGYA_STAGING_REVIEWER_EMAIL }}
          AAROGYA_STAGING_REVIEWER_PASSWORD: ${{ secrets.AAROGYA_STAGING_REVIEWER_PASSWORD }}
          AAROGYA_STAGING_EXPECTED_PROJECT_REF: ${{ inputs.staging_project_ref }}
          AAROGYA_STAGING_CONFIRM_WRITES: ${{ secrets.AAROGYA_STAGING_CONFIRM_WRITES }}
        run: python scripts/staging_supabase_integration.py
