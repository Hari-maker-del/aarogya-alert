name: Frontend build check
# Keeps the design integration verified with the current source tree.

on:
  push:
    branches: [main, stitch-signal-room]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test case-file report generation
        run: npm test
      - name: Build frontend
        run: npm run build
